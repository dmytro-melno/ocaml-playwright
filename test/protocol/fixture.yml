# Small independent protocol: all anonymous paths deliberately reuse field names.
Packet:
  type: object
  properties:
    text: string
    data: binary
    maybe: binary?
    nested:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              data: binary
              text: string
Common:
  type: mixin
  properties:
    options:
      type: object
      properties:
        state:
          type: enum
          literals: [same, identical]
Root:
  type: interface
  initializer:
    data: binary
    maybe: binary?
    packet: Packet
    entries:
      type: array
      items: binary
  events:
    sample:
      parameters:
        data: binary
        packet: Packet
        options:
          type: object
          properties:
            data: binary?
  commands:
    alpha:
      parameters:
        state:
          type: enum
          literals: [start, stop]
        options:
          type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  data: binary
                  state:
                    type: enum
                    literals: [one, two]
      returns:
        options:
          type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  ranges:
                    type: array
                    items:
                      type: object
                      properties:
                        start: int
                        end: int
    beta:
      parameters:
        state:
          type: enum
          literals: [attached, detached]
        options:
          type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  data: string
                  state:
                    type: enum
                    literals: [three, four]
      returns:
        options:
          type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  ranges:
                    type: array
                    items:
                      type: object
                      properties:
                        offset: float
                        count: int
    identicalA:
      parameters:
        $mixin: Common
    identicalB:
      parameters:
        $mixin: Common
    echo:
      parameters:
        data: binary
        maybe: binary?
        entries:
          type: array
          items: binary?
        packet: Packet
      returns:
        data: binary
        maybe: binary?
        entries:
          type: array
          items: binary?
        packet: Packet
    single:
      returns:
        entries:
          type: array?
          items: binary?
